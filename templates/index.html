<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>War Simulator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<nav class="navbar border-bottom px-3">
  <span class="navbar-brand fw-semibold">War Simulator</span>
  <span class="text-muted small">Card game of War — live win tracker</span>
</nav>

<div class="container-fluid p-3">
  <div class="row g-3">

    <!-- Left: chart panel -->
    <div class="col-lg-9 d-flex flex-column gap-3">

      <div class="row g-3">
        <div class="col-6">
          <div class="card h-100">
            <div class="card-body">
              <div class="text-uppercase text-muted small fw-semibold mb-2">Player 1</div>
              <div class="win-count p1-color" id="p1Count">0</div>
              <div class="text-muted small mt-1" id="p1Pct">—</div>
              <div class="progress mt-2" style="height:4px">
                <div class="progress-bar" id="p1Fill" role="progressbar" style="background:#58a6ff;width:0%"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6">
          <div class="card h-100">
            <div class="card-body">
              <div class="text-uppercase text-muted small fw-semibold mb-2">Player 2</div>
              <div class="win-count p2-color" id="p2Count">0</div>
              <div class="text-muted small mt-1" id="p2Pct">—</div>
              <div class="progress mt-2" style="height:4px">
                <div class="progress-bar" id="p2Fill" role="progressbar" style="background:#f78166;width:0%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card flex-fill">
        <div class="card-body">
          <div class="chart-wrap">
            <canvas id="chart"></canvas>
          </div>
        </div>
      </div>

    </div>

    <!-- Right: sidebar -->
    <div class="col-lg-3 d-flex flex-column gap-3">

      <div class="card">
        <div class="card-body">
          <h6 class="text-uppercase text-muted small fw-semibold mb-3">Run Simulation</h6>
          <div class="input-group">
            <input type="number" class="form-control" id="gameCount" value="100" min="1" max="1000" placeholder="Games">
            <button class="btn btn-success" id="runBtn" onclick="startRun()">Run</button>
          </div>
          <div class="progress mt-2" style="height:3px">
            <div class="progress-bar" id="progressFill" role="progressbar" style="width:0%"></div>
          </div>
          <div class="text-muted small mt-1" id="statusText" style="min-height:1em"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <h6 class="text-uppercase text-muted small fw-semibold mb-2">Stats</h6>
          <div class="d-flex justify-content-between align-items-center py-2 border-bottom small">
            <span class="text-muted">Games played</span>
            <span class="fw-semibold" id="totalGames">0</span>
          </div>
          <div class="d-flex justify-content-between align-items-center py-2 border-bottom small">
            <span class="text-muted">Avg rounds / game</span>
            <span class="fw-semibold" id="avgRounds">—</span>
          </div>
          <div class="d-flex justify-content-between align-items-center py-2 border-bottom small">
            <span class="text-muted">P1 win rate</span>
            <span class="fw-semibold p1-color" id="p1Rate">—</span>
          </div>
          <div class="d-flex justify-content-between align-items-center py-2 small">
            <span class="text-muted">P2 win rate</span>
            <span class="fw-semibold p2-color" id="p2Rate">—</span>
          </div>
        </div>
      </div>

      <div class="card flex-fill overflow-hidden">
        <div class="card-body d-flex flex-column overflow-hidden">
          <h6 class="text-uppercase text-muted small fw-semibold mb-2 flex-shrink-0">Game Log</h6>
          <div class="log-entries" id="logEntries"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
